        <img id="woodTex" src="rosewood_veneer1.png">

    <a-sky src="#skyTex"></a-sky>

    <a-light

        color="#FFF8EB"
        intensity="0.9">
    </a-light>

    <a-light
        type="directional"

        color="#FFF3DB"
        intensity="0.9">

    <!-- 
 CAMERA
-->

            active="true"
            rotation="-7 0 0"

        position="0 -0.08 0"
        rotation="-90 0 0"
        width="80"
        height="80"
        material="src: #sandTex;

                  roughness: 1">

        rotation="-90 0 0"
        radius-inner="6"
        radius-outer="8.7"
        material="src: #grassTex;
                  repeat: 6 6;
                  side: double">
